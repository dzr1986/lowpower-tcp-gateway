version: "3.8"

services:
  redis:
    image: redis:7
    container_name: lp-redis
    ports:
      - "6379:6379"

  gateway:
    build: .
    container_name: lowpower-tcp-gateway
    depends_on:
      - redis
    ports:
      - "9000:9000"
      - "8080:8080"
    volumes:
      - ./config.json:/app/config.json:ro